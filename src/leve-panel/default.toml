# ========================================================================================
#
#                                   Leve Panel
#                                 Default Config
#
# ========================================================================================

# Panel Settings
[Panel]
pos = "bottom"  # "top", "bottom", "left", "right"
layer = "bottom"  # "background", "bottom", "top", "overlay"
size = 46 # pixels
roundness = 20
margin_top = 10
margin_bottom = 10
margin_left = 25
margin_right = 25
color = "#070C1E" # Hex Color, or "rgba(40, 50, 160, 0.25)"
icon_size = 32
scroll_up = "swaymsg workspace prev"
scroll_down = "swaymsg workspace next"
#exclusive_zone = 52 # reserve space, defaults to size of panel


# Widgets appear left to right
[[Left]]
widget = "menu"
exec = "griddle"

[[Left]]
widget = "favorite"
icon = "folder-blue.png"
exec = "pcmanfm"

[[Left]]
widget = "favorite"
icon = "terminal.png"
exec = "foot"

[[Left]]
widget = "favorite"
icon = "google-chrome.png"
exec = "google-chrome"


# Center Widgets
[[Center]]
widget = "desktop"
style = "dots" # "classic", "modern", "number", "dots", "pills"


# Widgets on right side
# are added from right to left
[[Right]]
widget = "power"
exec = "wlogout"

[[Right]]
widget = "clock"
style = "modern" # "classic", "modern" -shows date and time
exec = "gsimplecal"

[[Right]]
widget = "mem"
exec = "btop"
terminal = true

[[Right]]
widget = "cpu"
exec = "btop"
terminal = true

[[Right]]
widget = "volume"
exec = "pavucontrol"
